_target_: src.models.components.shapeconv_sae.ShapeConvSAE
# Learned shapelet dictionary (ShapeConv encoder + tied decoder, Qu et al. ICLR 2024).
# One dictionary is shared by all channels. The trainer fits it without labels on
# the training windows (fit_unsupervised) before extracting features. Output per
# window: n_atoms event counts (summed over channels) + n_atoms best-cosine values.
# Writes sae_atoms.npy (n_atoms x atom_len) and sae_training.csv to the run dir.
spec:
  _target_: src.models.components.shapeconv_sae.AtomSpec
  n_atoms: 256
  atom_len: 128     # samples; 0.5 s at data.target_sfreq=256 (spike + start of slow wave)
  rho_min: 0.5      # cosine gate: an atom fires only where the signal has its shape
  amp_min: 0.0      # extra amplitude floor (robust-std units) for counted events
train_spec:
  _target_: src.models.components.shapeconv_sae.TrainSpec
  epochs: 5         # passes over the train dataloader (with lazy_loading each pass re-reads the EDFs)
  lr: 0.001
  topk: 4           # nonzero code entries per 1 s crop; 1 = shift-invariant spherical k-means
  crop_len: 256     # training crop in samples; must be >= atom_len
  crops_per_row: 16 # random crops per (window, channel) row per pass
  crop_batch: 1024  # crops per optimizer step
  lambda_div: 0.01  # shift-aware diversity penalty (0 disables)
  n_init_samples: 20000
random_state: 42
# Device: cpu | cuda | cuda:N | auto. Extraction memory ~ chunk_rows * n_atoms * T
# floats (16 rows of a 2-minute 256 Hz window with 256 atoms: about 2 GiB); lower
# chunk_rows on small GPUs.
device: auto
chunk_rows: 16
