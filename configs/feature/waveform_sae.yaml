_target_: src.models.components.waveform_sae.WaveformSAE
# Waveform SAE: multichannel learned waveforms (K, C, L), channel-summed correlation, ReLU,
# one maximum per window, top-R windows per atom and segment, tied conv_transpose1d decoder, reconstruction
# loss only (documentation/waveform_sae_implementation.md; mathematics in
# documentation/Minimal Waveform Autoencoder Mathematics.md). The sparsity comes from the
# selection: there is no threshold and no L1 penalty. The encoder convolves across the full
# segment; only the decoder is restricted to pooling windows and discards waveform tails.
# The number of channels is read from the
# data. Baseline: src/train_sae.py --config-name train_sae_waveform.
# Selecting only feature=waveform_sae leaves data settings separate. Classifier features
# are not implemented yet. Writes sae_state.pt, sae_atoms.npy, sae_atoms_signal.npy,
# sae_training.csv, sae_atom_stats.csv and sae_channels.txt to the run dir.
spec:
  _target_: src.models.components.waveform_sae.WaveformSpec
  n_atoms: 64
  atom_len: 80      # stored samples; 312 ms at data.target_sfreq=256. Even lengths are supported.
                    # L>P means every placement is truncated. With L=80,P=32 only taps 8..70
                    # can directly contribute to synthesis; all taps can contribute to encoding.
  pool_len: 32      # pooling window P in samples (125 ms); one maximum supplies each candidate.
                    # Segment tails are trimmed to a multiple of P (30720 = 960 * 32).
  top_r: 1          # windows kept per atom and full encoded segment (1 <= top_r <= T / P).
                    # R=1 means at most ONE activation per atom per segment, including long rows.
                    # R=T/P retains all window maxima. This is checkpoint format 4.
  pre_emphasis: none # encode the filtered waveform without differencing; robust scaling and clipping remain.
                    # diff is an optional comparison. sae_atoms.npy and sae_atoms_signal.npy
                    # both contain the atom itself under none; diff integrates the signal-domain export.
  atom_norm: unit   # unit: unit Frobenius norm over (C, L), re-imposed after every step.
                    # free: unit norm at initialization only; the loss sets the scale.
  center_atoms: false # subtract the temporal mean of every channel component before the norm
train_spec:
  _target_: src.models.components.waveform_sae.WaveformTrainSpec
  epochs: 30        # passes over the train dataloader; each usable segment is scored once per pass.
                    # With lazy_loading each pass re-reads the EDFs.
                    # 0 keeps the initialization (frozen-initialization control).
  lr: 0.001         # Adam; atom entries are about 1 / sqrt(C * L), so lower than the ShapeConv SAE
  crop_sampling: full # score complete input segments; input length must be a multiple of pool_len.
                    # R=1 is per atom per whole segment, independent of segment_batch.
  segment_batch: 2  # complete segments per optimizer step; lower to reduce gradient memory.
  max_crop_energy_ratio: null # required in full mode; no energy-ratio gate, including initialization.
  # Legacy controls, used only after explicitly selecting crop_sampling=random or tiled:
  crop_len: 1024
  crops_per_window: 16
  crop_batch: 64
  init: patches     # patches: full-segment encoder receptive fields; random: Gaussian atoms
  recenter_atoms: true # after every epoch but the last, shift each atom so its energy centroid is
                    # at the center of its support (zero fill; Adam moments follow). Synthetic
                    # recovery 2026-10-06: a waveform that lands over an atom edge at the start
                    # stays cut off (no gradient outside the support); the fit then stops at 2-3x
                    # the residual of the planted solution even at twice the waveform length.
  full_window_val: true # legacy crop modes: also measure complete validation segments.
                    # Full mode always validates full segments; val_* and val_full_* are aliases.
random_state: 42
# Path to a sae_state.pt written by src/train_sae.py feature=waveform_sae. When set, the
# dictionary is loaded and fit_unsupervised is skipped; every spec field must equal the
# checkpoint's. Formats 1, 2 and 3 use different selection or boundaries and are rejected.
pretrained: null
# Device: cpu | cuda | cuda:N | auto.
device: auto
# Whole source segments per pass for crop selection and full-window validation.
# Lower this to reduce full-segment response memory; it does not change the competition domain.
chunk_windows: 8
